[project]
name = "crypto-backtester"
version = "0.1.0"
description = "Trial project for the SDLC framework plugin."
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "tzdata; sys_platform == 'win32'"]

[tool.setuptools]
packages = ["app", "app.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
