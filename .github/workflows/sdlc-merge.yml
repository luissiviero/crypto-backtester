# The deploy gate is the owner's approving review; the merge App merges on it (decision 36; ROADMAP
# R22). Three jobs, no model:
#
# - on-approval, on the owner's approving review of a build PR: it dispatches this workflow
#   on the default branch with the pull request's number. It holds no key: a review-triggered
#   run may use the pull request's copy of this file, so it only dispatches.
# - not-a-build-pr, on every pull request whose head is not sdlc/<id>/build: it posts a
#   passing sdlc/review check ("not a build PR") on the head, so the review ruleset, which
#   requires that check, holds only build PRs (decision 36, point 5). pr/cli.py upsert posts the same check
#   on the pull requests the workflow token opens or updates, whose events start no run.
# - merge, on the dispatch (on-approval's, or the deploy run's when the review turned green
#   after an early approval): in the sdlc-merge environment, which only the default branch
#   may use, it mints the merge App's token and runs plugin/ci/merge_step.py, which re-checks
#   everything from the API (the owner's approval, the build PR at sdlc:deploy-ready, the deploy gate's
#   record, the review findings and every commit after them, sdlc/review green on the head)
#   and merges at exactly that head. A check that does not hold is a green run that says
#   why; a merge GitHub refuses (a conflict, a rule) is red, for R18's "Failed runs". Either
#   way the PR stays open and shows in the digest (decisions 11 and 20).
#
# The merge App is one of its own, not the App the automation pushes as (decision 33):
# GitHub grants a bypass to an actor, not to a job, and the phase runners hold that App's
# token, so only the merge App is a bypass actor of the merge ruleset (choice 242, point 4). Its key
# is a secret of the sdlc-merge environment, read here only. Without vars.SDLC_MERGE_APP_ID
# the merge job says so and stops: no merge App, so the owner merges after approving.
#
# Contract: docs/OPERATING_MODEL.md sections 3 and 4.2, decision 36, article p.33-35
# ("Approval comes from a human through branch protection, informed by the findings").
# Installed into this project by /sdlc-init from the framework's template/.github/workflows/;
# edit it here, not in the framework. /sdlc-init filled in the framework repository.
name: SDLC merge (deploy)

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      change_id:
        description: "Four-digit change id, e.g. 0001"
        required: true
        type: string
      head_ref:
        description: "The build PR's head, e.g. sdlc/0001/build"
        required: false
        type: string
      pr:
        description: "The build PR's number"
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

jobs:
  on-approval:
    # A coarse filter; merge_step.py on-approval checks the owner's account (decision 34).
    if: >-
      ${{ github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      !endsWith(github.event.review.user.login, '[bot]') &&
      startsWith(github.event.pull_request.head.ref, 'sdlc/') &&
      endsWith(github.event.pull_request.head.ref, '/build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch, never the pull request's head: the owner's copies judge it.
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Check the approval and dispatch the merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/merge_step.py on-approval --root . --repo "$REPO"

  not-a-build-pr:
    if: >-
      ${{ github.event_name == 'pull_request' &&
      !(startsWith(github.event.pull_request.head.ref, 'sdlc/') &&
      endsWith(github.event.pull_request.head.ref, '/build')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Post sdlc/review (not a build PR)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python framework/plugin/ci/merge_step.py not-build --root . --repo "$REPO"

  merge:
    # A dispatch on the default branch only, beside the environment's own branch rule (GitHub
    # creates a referenced environment that does not exist yet, with no rule).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # Only the default branch may use this environment (its deployment branch rule, set up
    # by /sdlc-init step 6): a dispatch on another ref never reaches the merge App's key.
    # The job that holds a bypass actor's key runs its actions at a commit SHA, which no one
    # can move, not at a tag (choice 250; the R22 double check, F9).
    environment: sdlc-merge
    # A group of its own: it never waits behind, or cancels, a pending phase run of the change.
    concurrency:
      group: "sdlc-merge-${{ inputs.pr }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Say that no merge App is set up (merge it yourself)
        if: ${{ vars.SDLC_MERGE_APP_ID == '' }}
        run: python -c "print('merge - wait - no merge App, vars.SDLC_MERGE_APP_ID is not set in the sdlc-merge environment - merge it yourself after approving the build PR (decision 36; /sdlc-init step 6)')"

      - name: Mint the merge App's token (decision 36)
        id: app
        if: ${{ vars.SDLC_MERGE_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SDLC_MERGE_APP_ID }}
          private-key: ${{ secrets.SDLC_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the default branch
        if: ${{ vars.SDLC_MERGE_APP_ID != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        if: ${{ vars.SDLC_MERGE_APP_ID != '' }}
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        if: ${{ vars.SDLC_MERGE_APP_ID != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      # The workflow token reads; the merge App's token is used for the merge call only.
      - name: Check gate (deploy) and merge
        if: ${{ vars.SDLC_MERGE_APP_ID != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDLC_MERGE_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/merge_step.py merge --root . --repo "$REPO" --pr "$PR"
