# The maintain phase: the deterministic detection script on a schedule, and the diagnosis
# it invokes when a control band is breached (build guide step 37; decisions 14, 15, 26).
#
# Contract: docs/OPERATING_MODEL.md sections 4 (the triage gate), 4.1 (the maintain row) and 4.2, article
# p.42-45 ("A deterministic script watches production and invokes Claude when a control
# band is breached"; the trigger layer "can be a scheduled workflow in GitHub"; "At 1σ the
# script only logs, at 2σ it invokes Claude read-only to diagnose, and at 3σ Claude may act,
# though only by opening a PR into the review gate or triggering a pre-approved runbook").
# Installed into this project by /sdlc-init from the framework's template/.github/workflows/;
# edit it here, not in the framework. The bands are the project's bands.yaml; a bands change
# is a bands.yaml pull request, never something a run writes (step 39).
#
# What one run does: detect/cli.py run reads the metric's daily series from the source
# (the GitHub Actions runs API, cached across runs), computes the rolling statistics and
# the Western Electric rules with no model involved, appends one line to the detection log
# (uploaded as an artifact: the p.45 leading indicator, "the detection script's log has the
# breach timestamp and tier"), and at tier 2 or 3 files one incident change on sdlc/<id>/intent
# - unless an incident of the same metric is already open or the finding was dismissed
# (changes/.dismissed.json). Then, only when a change was filed, run_phase.py runs the
# diagnosis: /sdlc-maintain, read-only on source, which writes the incident intent.md and
# the proposed route, dispatches it (a pre-approved runbook runs and opens its PR; an `ask`
# route parks the PR with "Go" requested) and opens the intent PR with the labels
# sdlc:maintain-ready and sdlc:triage. The triage gate is your triage of that PR (decision 25).
#
# Token rule (decision 33): with the repository variable SDLC_APP_ID set, the job pushes and
# opens the incident PR with the project's GitHub App token, and the events the App causes do
# start workflow runs (the project's CI on the incident head; the design workflow skips a PR a
# [bot] opened). The App is required (R22, 1.0.18): without it nothing is
# filed, and the run goes red with the reason. Past 50 minutes the job falls back to the
# workflow token, and its commits and pull requests never start another workflow run. Either way your merge, label or close of the
# incident PR fires the design, runbook or abandon workflow normally. The App's private key
# reaches the mint step only. No deploy credential reaches the model's step; a project runbook
# with a command runs in the "Dispatch the route" step below, whose env: is where the
# repository's own secrets go (as for the release); the model's session never sees them, and
# the dispatcher judges the route by the default branch's bands.yaml and sdlc.yaml, never the
# checkout's (decisions 11 and 14).
#
# Schedule note: cron is UTC, runs on the default branch, and an off-the-hour minute is less
# delayed than :00. GitHub disables schedules in a public repository after 60 days without
# activity; the workflow_dispatch trigger is how the owner re-enables it, and its force_tier
# input rehearses the whole loop on demand (recorded as "forced" in the detection record).
#
# /sdlc-init filled in the framework repository. The Claude Code version is read from
# sdlc.yaml at run time.
name: SDLC detect (maintain)

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      force_tier:
        description: "Rehearse the loop: file an incident at this tier whatever the metric says (2 = diagnose, 3 = propose); empty = the real verdict"
        required: false
        type: choice
        options: ["", "2", "3"]
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

concurrency:
  group: "sdlc-detect"
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Decision 33: the automation pushes and opens pull requests as the project's GitHub
      # App, required since 1.0.18 (R22): without the repository variable SDLC_APP_ID this
      # step is skipped, and the runner refuses the run before it pushes or opens anything
      # (ci/app_token.py app_missing). The private key is read here only.
      - name: Mint the App token (decision 33; skipped without vars.SDLC_APP_ID)
        id: app
        if: ${{ vars.SDLC_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          # no more than this job's permissions: block grants the workflow token
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: write
          permission-actions: read

      # The token expires an hour after it is minted (the action's README); past 50
      # minutes the runner publishes with the workflow token instead (ci/app_token.py),
      # counted from this time.
      - name: Record when the App token was minted
        if: steps.app.outcome == 'success'
        run: python -c "import os, time; f = open(os.environ['GITHUB_ENV'], 'a'); f.write('SDLC_APP_TOKEN_MINTED_AT=%d\n' % time.time()); f.close()"

      - name: Check out the project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          # a scheduled run's event payload may carry no repository (not verified live,
          # NOTES section 16): there the checked-out ref is the default branch
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      # The runs cache: one fetch per run covers the days since the last one, not the whole
      # window. Its absence only costs API calls.
      - name: Restore the runs cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sdlc/detect-cache.json
          key: sdlc-detect-${{ github.run_id }}
          restore-keys: sdlc-detect-

      # Detection stays deterministic (p.43 step 2): no model, no credential but the
      # automation's token for the runs API. At tier 2 or 3 --file opens the incident change.
      - name: Detect
        id: detect
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE_TIER: ${{ inputs.force_tier }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/detect/cli.py run --root . --repo "$REPO" --cache .sdlc/detect-cache.json --log detect-log.jsonl --force-tier "$FORCE_TIER" --file

      - name: Keep the detection log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-detect-log-${{ github.run_id }}
          path: detect-log.jsonl
          if-no-files-found: ignore

      - if: steps.detect.outputs.change_id != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        if: steps.detect.outputs.change_id != ''
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.claude_code }}
        run: npm install -g @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION"

      - name: Prepare the runner for Claude Code's sandbox
        if: steps.detect.outputs.change_id != ''
        run: python framework/plugin/ci/runner_setup.py

      - name: "Install the project's own toolchain (sdlc.yaml: commands.setup)"
        id: setup
        if: steps.detect.outputs.change_id != ''
        run: python framework/plugin/ci/project_setup.py --root . --out "$RUNNER_TEMP/sdlc-setup.json"

      # The diagnosis (p.43 step 3, 2σ "read-only to diagnose"): the model writes the
      # incident intent and the proposed route, commits them and stops (--diagnosis-only).
      - name: Run the maintain phase
        id: phase
        if: steps.detect.outputs.change_id != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ steps.detect.outputs.change_id }}
          HEAD_REF: ${{ steps.detect.outputs.head_ref }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase maintain --id "$CHANGE_ID" --head-ref "$HEAD_REF" --repo "$REPO" --ref "$DEFAULT_BRANCH" --out "$RUNNER_TEMP/sdlc-run.json"

      # The diagnosis ran a session holding Write and Bash(git *) in this same checkout
      # (PROGRESS session 8, "the shared checkout"; the review of the 0.2.26 diff, M4):
      # the framework checkout it could reach is removed and checked out afresh at the pin
      # the first step read (a step output lives in the runner), then the project
      # checkout's remote, refspec and config are verified from that fresh copy and the
      # default branch fetched again by URL (plugin 0.2.27; plugin/ci/checkout_check.py).
      - name: Remove the framework checkout the session could reach
        if: steps.detect.outputs.change_id != ''
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh (public repository, no token)
        if: steps.detect.outputs.change_id != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Verify the project checkout before the next step
        if: steps.detect.outputs.change_id != ''
        env:
          PIN_REF: ${{ steps.pin.outputs.ref }}
          # R49: the fetch's credential, in its environment only (ci/app_token.py
          # git_auth_env): the App's token while fresh, else the workflow token
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
          FRAMEWORK_URL: ${{ github.server_url }}/luissiviero/sdlc-framework
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/checkout_check.py --root . --framework framework --pin-ref "$PIN_REF" --origin "$ORIGIN_URL" --framework-origin "$FRAMEWORK_URL"

      # 3σ "may act, though only by opening a PR into the review gate or triggering a
      # pre-approved runbook": the deterministic dispatcher, then the triage gate and the intent
      # PR. No model runs here. A project runbook's own secrets belong in this step's env:.
      # The detection record it judges is compared with the digest the Detect step printed
      # (a step output lives in the runner, not in the checkout): a record the session
      # changed is refused and the change parked (plugin 0.2.27).
      - name: Dispatch the route, run gate (maintain) and open the intent PR
        if: steps.detect.outputs.change_id != ''
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ steps.detect.outputs.change_id }}
          REPO: ${{ github.repository }}
          DETECTION_SHA256: ${{ steps.detect.outputs.detection_sha256 }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/detect/cli.py finish --root . --id "$CHANGE_ID" --repo "$REPO" --detection-sha256 "$DETECTION_SHA256"

      # R18: a failed run explains itself. After a failed setup or runner step, or a park
      # with a log to read (the runner's explain=park output; a park ends the job green), the
      # framework checkout the session could reach is replaced and the project checkout
      # verified, as after the review pass; then the read-only explain session (Read only, no
      # GitHub token, .git and /proc denied) reads the run's files. Its lines, model-written
      # and scanned for secrets, join the park block or a failed-run record on
      # refs/sdlc/failed-runs/, which the digest's "Failed runs" line reads. Neither step
      # fails the job (plugin/ci/explain.py).
      - name: Remove the framework checkout before the explain step
        if: always() && steps.detect.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park')
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh for the explain step (public repository, no token)
        if: always() && steps.detect.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Verify the project checkout before the explain step
        id: explain_checkout
        if: always() && steps.detect.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park')
        env:
          PIN_REF: ${{ steps.pin.outputs.ref }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
          FRAMEWORK_URL: ${{ github.server_url }}/luissiviero/sdlc-framework
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/checkout_check.py --root . --framework framework --pin-ref "$PIN_REF" --origin "$ORIGIN_URL" --framework-origin "$FRAMEWORK_URL"

      # The read-only half: the model credential and no GitHub token in its environment, so
      # nothing the session reads, /proc included, holds one; its lines go to a file.
      - name: Explain the failed or parked run (read-only, model-written)
        if: always() && steps.explain_checkout.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase explain --out "$RUNNER_TEMP/sdlc-run.json" --setup "$RUNNER_TEMP/sdlc-setup.json" --lines "$RUNNER_TEMP/sdlc-explain.json"

      # The writing half: the token and no model credential, no model run; the lines into
      # the park block or a failed-run record (a missing file: a record with no lines).
      - name: Publish the explanation (the park block, or a failed-run record)
        if: always() && steps.explain_checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase explain --repo "$REPO" --out "$RUNNER_TEMP/sdlc-run.json" --setup "$RUNNER_TEMP/sdlc-setup.json" --publish "$RUNNER_TEMP/sdlc-explain.json"

      # Build guide step 41.1 (article p.39): every hook decision of the run is one line of
      # changes/<id>-<slug>/evidence/hook-log.jsonl (committed with the evidence) or of
      # changes/.hook-log.jsonl; the artifact keeps them readable when a run never committed.
      - name: Keep the hook log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-hook-log-${{ github.run_id }}
          path: |
            changes/**/evidence/hook-log.jsonl
            changes/.hook-log.jsonl
          if-no-files-found: ignore
