# The project's own CI: the one workflow the SDLC maintain metric counts (the CI test
# failure rate). The framework's SDLC workflows are excluded from that metric by design.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolchain
        run: python -m pip install pytest==9.1.1 ruff==0.16.9
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
