# The fix round (decision 22; build guide steps 8 and 26): the owner's "Request changes"
# review on any phase's pull request starts /sdlc-fix on that PR's own head branch, and so
# does one of the owner's un-park labels (decision 24: sdlc:reset-iterations,
# sdlc:unlock-tests; sdlc:accept-risk retired with decision 35, plugin 1.0.15: a risk-list
# hit no longer parks), which the run performs first. Intent, design and
# build PRs alike; the only notification is the owner's review request on a PR that waits
# (decision 31, OPERATING_MODEL section 7). Since plugin 1.0.3
# (decision 29) the phase runner also dispatches this workflow itself when its commands step
# finds a red target below the iteration cap: the round applies the failing targets as its
# constraint (a red-targets request), and the change parks for the owner only at the cap.
# Since R17 (decision 34) the owner's pull request comment that starts with @claude starts
# the same round: sdlc-comment.yml checks it and dispatches this workflow with the change
# id, the head branch and the comment's link (the trigger input).
#
# Contract: docs/OPERATING_MODEL.md section 4.2 (the trigger and dispatch table) and 5, build
# guide step 30, article p.33-34 ("Claude addresses the comment and pushes the fix"; "let
# Claude babysit the PR to merge") and p.39-41 ("Run Claude Code non-interactively inside
# the CI/CD pipeline, sandbox the execution"). Installed into this project by /sdlc-init from
# the framework's template/.github/workflows/; edit it here, not in the framework.
#
# Token rule (decision 33): with the repository variable SDLC_APP_ID set, the round pushes with
# the project's GitHub App token, and the events the App causes do start workflow runs - the
# project's CI runs on its heads with no approval click. The App is required (R22, 1.0.18):
# without it the runner refuses the round. Past 50 minutes the round falls back to the
# workflow token, and the events it causes never start another workflow run - only
# workflow_dispatch and repository_dispatch do. The owner's review and labels fire this
# workflow normally; the job condition refuses a [bot] reviewer and a label a [bot] applied, so
# the App's own events never start a round. The App's private key reaches the mint step only.
# The job holds no deploy secret and no production credential (article p.40).
#
# By-hand rule: GitHub refuses "Request changes" on the reviewer's own pull request, so a
# pull request the owner opened by hand (one the automation identity could not open) never
# fires the review trigger for the owner's words - there the review is a comment review and
# the round is one PR comment starting with @claude (decision 34), or a workflow_dispatch
# with the change id and the head branch (0.3.2; the framework's change 0001, 2026-10-02).
#
# Reviewer rule: a review starts a round only when its author is the owner's account
# (decision 34), and never on a head in another repository (a fork). On a personal
# repository the job condition already requires the repository owner, so a refused review
# never enters the concurrency group (the 1.0.3 promise below). On an organization
# repository the condition keeps only the member check (author_association OWNER, MEMBER or
# COLLABORATOR: the owner's association is not always OWNER, and the owner's account is named
# in sdlc.yaml, which an expression cannot read); there a member's review enters the group,
# a known limit. The exact check is the find step's on both (run_phase.py --find-change
# reads the review's author from the event payload and judges it with is_owner_actor against
# the default branch's sdlc.yaml), so a refused round installs nothing and runs no model. On a public repository anyone with read
# access can request changes, and the review's words would reach this privileged run (the
# sample repository's weekly security review, 2026-09-25); a label already needs triage or
# write permission. The exact check of who applied a label is the runner's too: the find
# step refuses a label another account applied, before anything installs (label_refusal),
# and the run performs an un-park label only when the owner's account applied it
# (state/unpark.py perform, is_owner_actor, fail closed; choice 218).
#
# The change is found from the pull request's own files (its changes/<id>-<slug>/ folder),
# never from the head name alone: a web-session intent PR carries a claude/... head, and an
# unmerged intent PR has no status.yaml on the default branch. The run checks that head out
# and commits on it.
#
# /sdlc-init filled in the framework repository. The Claude Code version is read from
# sdlc.yaml at run time.
name: SDLC fix (review comments)

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: "Four-digit change id, e.g. 0001"
        required: true
        type: string
      head_ref:
        description: "The pull request's head branch, e.g. sdlc/0001/build; it keys the concurrency group"
        required: false
        type: string
      trigger:
        description: "The link of the owner's @claude comment that started this round (decision 34)"
        required: false
        type: string
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write

# One run at a time per pull request head: a fix round shares the group of the phase runs of
# the same branch (OPERATING_MODEL section 4.2), so it never races a dispatched phase; the
# group is set on the job below.
jobs:
  fix:
    # A review counts when it asks for changes and a person who is a member of the
    # repository submitted it (the review's state is lower-case in the event payload; a
    # `[bot]` reviewer never starts a round; CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER
    # and NONE are refused). Decision 34: on a personal repository the reviewer must be the
    # repository owner here already; on an organization repository (whose owner names an
    # account in sdlc.yaml: owner) any member passes this filter and the find step makes the
    # exact check. A review or a label on a head in another repository (a fork) never
    # counts. A label counts only when it is one of the owner's two un-park verbs and no
    # [bot] applied it (R49: the App's own labels start workflows).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.state == 'changes_requested' &&
      !endsWith(github.event.review.user.login, '[bot]') &&
      (github.event.review.user.login == github.repository_owner ||
      github.event.repository.owner.type == 'Organization') &&
      (github.event.review.author_association == 'OWNER' ||
      github.event.review.author_association == 'MEMBER' ||
      github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.sender.login, '[bot]') &&
      (github.event.label.name == 'sdlc:reset-iterations' ||
      github.event.label.name == 'sdlc:unlock-tests')) }}
    # 1.0.3 (decision 29): the group is the job's, not the workflow's, so an event whose job
    # is skipped by the condition above (a comment-only review, another label) never enters
    # it and cannot cancel a pending run - the automatic fix round the runner dispatched, or
    # a round an @claude comment dispatched (decision 34), among them. Job and workflow
    # groups of one name are one group in the repository. Known limit (decision 34): on an
    # organization repository a member's "Request changes" review passes the condition,
    # enters the group and may displace a pending run before the find step refuses it; on
    # a personal repository only the owner's review enters it.
    concurrency:
      group: "sdlc-${{ inputs.head_ref || github.event.pull_request.head.ref }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 0.3.0: the session's wall clock (gate.max_wall_clock_minutes, 120 by default, plus
    # 5 of grace) and then the gate's commands step, which runs the three targets after
    # the session at gate.command_timeout each (900 s by default): 125 + 50 minutes;
    # 1.0.3 (decision 29): + 10 for the judge at the iteration cap; 1.0.8 (decision 32): the
    # build run and every fix round take gate.build_max_wall_clock_minutes (180 by default),
    # so 185 + 50 + 10, with room
    # Change 0004: a set commands.drive adds gate.drive_timeout to the commands step (300 s by
    # default: 185 + 55 + 10 = 250 of 260; at most 600 s at build and test: 255). Not counted
    # here: commands.setup (up to 15 minutes, more with Playwright's browser install) and the
    # R18 explain step after a park (5 minutes). In a fix round at deploy R51's merge and
    # re-check of the targets (up to 45 minutes, only when the default branch moved) come
    # before the session, and since 1.0.49 (decision 41) the runner takes the minutes they
    # took off that session's cap, as it takes the drive's, never below 30: r + (180 - r + 5)
    # + 50 + 10 = 245 of 260 for any r up to 45, with or without a drive. Not counted either:
    # check 12's re-check after the push (45 more when the branch moved during the run). A job
    # past 260 is cancelled by GitHub; since 1.0.50 (decision 41 point 2) the step after the
    # runner's parks such a round, keeping its uncommitted work, within the minutes GitHub
    # leaves after the cancel (about five past the timeout, docs/notes/62.md)
    timeout-minutes: 260
    env:
      # the runner gives the build caps only to a job that says it allows them (decision 32);
      # keep it equal to timeout-minutes
      SDLC_JOB_TIMEOUT_MINUTES: 260
    steps:
      # Decision 33: the automation pushes and opens pull requests as the project's GitHub
      # App, required since 1.0.18 (R22): without the repository variable SDLC_APP_ID this
      # step is skipped, and the runner refuses the run before it pushes or opens anything
      # (ci/app_token.py app_missing). The private key is read here only.
      - name: Mint the App token (decision 33; skipped without vars.SDLC_APP_ID)
        id: app
        if: ${{ vars.SDLC_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          # no more than this job's permissions: block grants the workflow token
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: write
          permission-actions: write

      # The token expires an hour after it is minted (the action's README); past 50
      # minutes the runner publishes with the workflow token instead (ci/app_token.py),
      # counted from this time.
      - name: Record when the App token was minted
        if: steps.app.outcome == 'success'
        run: python -c "import os, time; f = open(os.environ['GITHUB_ENV'], 'a'); f.write('SDLC_APP_TOKEN_MINTED_AT=%d\n' % time.time()); f.close()"

      # The pull request's head, not the event's default ref (a review event checks out the
      # merge ref): the round commits on the branch the PR is opened from.
      - name: Check out the pull request's head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          token: ${{ steps.app.outputs.token || github.token }}
          ref: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          # a scheduled run's event payload may carry no repository (not verified live,
          # NOTES section 16): there the checked-out ref is the default branch
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      # --id wins (a dispatch), then a head sdlc/<id>/<phase>, then the one changes/<id>-<slug>/
      # folder the pull request touches. An empty change_id skips every step below. On a
      # review the step first refuses a reviewer who is not the owner's account, or a head in
      # another repository (decision 34), reading the review from GITHUB_EVENT_PATH and the
      # owner from the default branch's sdlc.yaml.
      - name: Find the change this pull request carries
        id: find
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ inputs.change_id }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase fix --id "$CHANGE_ID" --head-ref "$HEAD_REF" --repo "$REPO" --pr-number "$PR_NUMBER" --find-change

      - if: steps.find.outputs.change_id != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # The version comes from the pin step at run time, so a bump in sdlc.yaml applies on
      # the next run; re-install the workflows only when this file itself changes.
      - name: Install the pinned Claude Code CLI
        if: steps.find.outputs.change_id != ''
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.claude_code }}
        run: npm install -g @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION"

      - name: Prepare the runner for Claude Code's sandbox
        if: steps.find.outputs.change_id != ''
        run: python framework/plugin/ci/runner_setup.py

      # R44 (the head's own setup command): this checkout is a session's head, so the
      # command is read from the default branch's sdlc.yaml, never the head's, and whatever
      # the install wrote under framework/ is removed: the framework is checked out afresh at
      # the pin the first step read before the step that holds the credentials.
      - name: "Install the project's own toolchain (sdlc.yaml: commands.setup)"
        id: setup
        if: steps.find.outputs.change_id != ''
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/project_setup.py --root . --command-from "refs/remotes/origin/$SDLC_DEFAULT_BRANCH" --out "$RUNNER_TEMP/sdlc-setup.json"

      - name: Remove the framework checkout the install could reach
        if: steps.find.outputs.change_id != ''
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh (public repository, no token)
        if: steps.find.outputs.change_id != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Run the fix round
        id: phase
        if: steps.find.outputs.change_id != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ steps.find.outputs.change_id }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # decision 34: the owner's @claude comment the dispatcher passed, written into
          # evidence/fix-requests.json as the round's trigger; an input, never in a run line
          SDLC_TRIGGER: ${{ inputs.trigger }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase fix --id "$CHANGE_ID" --head-ref "$HEAD_REF" --repo "$REPO" --pr-number "$PR_NUMBER" --ref "$DEFAULT_BRANCH" --out "$RUNNER_TEMP/sdlc-run.json"

      # R18: a failed run explains itself. After a failed setup or runner step, or a park
      # with a log to read (the runner's explain=park output; a park ends the job green), the
      # framework checkout the session could reach is replaced and the project checkout
      # verified, as after the review pass; then the read-only explain session (Read only, no
      # GitHub token, .git and /proc denied) reads the run's files. Its lines, model-written
      # and scanned for secrets, join the park block or a failed-run record on
      # refs/sdlc/failed-runs/, which the digest's "Failed runs" line reads. Neither step
      # fails the job (plugin/ci/explain.py).
      - name: Remove the framework checkout before the explain step
        if: always() && steps.find.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park' || steps.setup.outcome == 'cancelled' || steps.phase.outcome == 'cancelled')
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh for the explain step (public repository, no token)
        if: always() && steps.find.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park' || steps.setup.outcome == 'cancelled' || steps.phase.outcome == 'cancelled')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Verify the project checkout before the explain step
        id: explain_checkout
        if: always() && steps.find.outputs.change_id != '' && (steps.setup.outcome == 'failure' || steps.phase.outcome == 'failure' || steps.phase.outputs.explain == 'park' || steps.setup.outcome == 'cancelled' || steps.phase.outcome == 'cancelled')
        env:
          PIN_REF: ${{ steps.pin.outputs.ref }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
          FRAMEWORK_URL: ${{ github.server_url }}/luissiviero/sdlc-framework
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/checkout_check.py --root . --framework framework --pin-ref "$PIN_REF" --origin "$ORIGIN_URL" --framework-origin "$FRAMEWORK_URL"

      # Decision 41 (R67): a runner step GitHub cancelled, at the job's timeout-minutes or by
      # hand, parks the change from the state the runner saved beside its --out file, with
      # the reason, "what I need from you" and the review request, and no re-run; a fix
      # round first keeps the session's uncommitted work in one commit, not gated. No model
      # runs, and it comes before the explain steps: GitHub stops the job about five minutes
      # past its timeout (docs/notes/62.md).
      - name: Park the change after a cancelled run, before the explain steps (decision 41)
        if: always() && steps.find.outputs.change_id != '' && steps.explain_checkout.outcome == 'success' && (steps.setup.outcome == 'cancelled' || steps.phase.outcome == 'cancelled')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # the head the job checked out: the saved state must name it
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase fix --cancelled --repo "$REPO" --out "$RUNNER_TEMP/sdlc-run.json"

      # The read-only half: the model credential and no GitHub token in its environment, so
      # nothing the session reads, /proc included, holds one; its lines go to a file.
      - name: Explain the failed or parked run (read-only, model-written)
        if: always() && steps.explain_checkout.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase explain --out "$RUNNER_TEMP/sdlc-run.json" --setup "$RUNNER_TEMP/sdlc-setup.json" --lines "$RUNNER_TEMP/sdlc-explain.json"

      # The writing half: the token and no model credential, no model run; the lines into
      # the park block or a failed-run record (a missing file: a record with no lines).
      - name: Publish the explanation (the park block, or a failed-run record)
        if: always() && steps.explain_checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase explain --repo "$REPO" --out "$RUNNER_TEMP/sdlc-run.json" --setup "$RUNNER_TEMP/sdlc-setup.json" --publish "$RUNNER_TEMP/sdlc-explain.json"

      # Build guide step 41.1 (article p.39): every hook decision of the run is one line of
      # changes/<id>-<slug>/evidence/hook-log.jsonl (committed with the evidence) or of
      # changes/.hook-log.jsonl; the artifact keeps them readable when a run never committed.
      - name: Keep the hook log
        if: steps.find.outputs.change_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-hook-log-${{ github.run_id }}
          path: |
            changes/**/evidence/hook-log.jsonl
            changes/.hook-log.jsonl
          if-no-files-found: ignore
