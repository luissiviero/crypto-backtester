# The maintain phase: the weekly security review and the deterministic scanners (build guide
# step 38; decision 16).
#
# Contract: docs/OPERATING_MODEL.md sections 4 (the triage gate) and 4.2, article p.46-48 ("run the
# scan on a schedule, without a human in the invocation path, and send what it finds through
# the same gates as any other change"; "The deterministic checks stay in CI, and the
# model-driven scan covers the context-dependent vulnerabilities those checks are not built to
# find"). Installed into this project by /sdlc-init from the framework's
# template/.github/workflows/; edit it here, not in the framework.
#
# What one run does: scan/cli.py review runs one read-only claude -p over the whole codebase
# at the commit checked out (Read, Grep, Glob and git; one Write, of scan-findings.json),
# applying the security-baseline skill and REVIEW.md's "What Important means here". Then
# scan/cli.py route files every Important finding that you have not dismissed - at most three
# a week, the rest return next week - as an incident intent change on sdlc/<id>/intent with the
# intent PR labelled sdlc:triage: a bounded finding (one file, one patch) as a fix whose
# Proposed outcome is the patch, a wider one as a feature intent that describes the class.
# The triage gate is your triage of that PR (decision 25): merge to fix it through the pipeline,
# label `sdlc:schedule` to keep it, or close it with a comment to dismiss it (the finding does not
# return, article p.47 step 4). Last, scan/cli.py scanners runs pip-audit and bandit (Python)
# or npm audit (Node): reports in the job summary and the artifacts, never a failed job.
#
# Token rule (decision 33): with the repository variable SDLC_APP_ID set, the job pushes and
# opens the intent PRs with the project's GitHub App token, and the events the App causes do
# start workflow runs (the project's CI on the incident heads; the design workflow skips a PR a
# [bot] opened). The App is required (R22, 1.0.18): without it nothing is
# filed, and the run goes red with the reason. Past 50 minutes the job falls back to the
# workflow token, and its commits and pull requests never start another workflow run. Either way your merge or close of an intent PR
# fires the design or abandon workflow normally. The App's private key reaches the mint step
# only. The job holds no deploy secret and no production credential (p.40).
#
# Schedule note: cron is UTC, runs on the default branch, and an off-the-hour minute is less
# delayed than :00. GitHub disables schedules in a public repository after 60 days without
# activity; the workflow_dispatch trigger re-enables it and runs the scan on demand.
#
# /sdlc-init filled in the framework repository. The Claude Code version is read from
# sdlc.yaml at run time.
name: SDLC scan (maintain)

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# checks: write for the passing sdlc/review "not a build PR" on the pull request this job
# opens, also after the in-job fallback to the workflow token (the R22 double check, F5).
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: "sdlc-scan"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Decision 33: the automation pushes and opens pull requests as the project's GitHub
      # App, required since 1.0.18 (R22): without the repository variable SDLC_APP_ID this
      # step is skipped, and the runner refuses the run before it pushes or opens anything
      # (ci/app_token.py app_missing). The private key is read here only.
      - name: Mint the App token (decision 33; skipped without vars.SDLC_APP_ID)
        id: app
        if: ${{ vars.SDLC_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          # no more than this job's permissions: block grants the workflow token
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: write

      # The token expires an hour after it is minted (the action's README); past 50
      # minutes the runner publishes with the workflow token instead (ci/app_token.py),
      # counted from this time.
      - name: Record when the App token was minted
        if: steps.app.outcome == 'success'
        run: python -c "import os, time; f = open(os.environ['GITHUB_ENV'], 'a'); f.write('SDLC_APP_TOKEN_MINTED_AT=%d\n' % time.time()); f.close()"

      - name: Check out the project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          # a scheduled run's event payload may carry no repository (not verified live,
          # NOTES section 16): there the checked-out ref is the default branch
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.claude_code }}
        run: npm install -g @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION"

      - name: Prepare the runner for Claude Code's sandbox
        run: python framework/plugin/ci/runner_setup.py

      # The review reads the code; it needs none of the project's toolchain, so no setup
      # step runs before it. Read-only but for the findings file (decision 16).
      - name: Weekly security review (read-only claude -p)
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: python framework/plugin/scan/cli.py review --root . --plugin-dir framework --claude claude --head "$HEAD_SHA" --out scan-findings.json --run-record scan-run.json

      # R44 (the plugin security review of 2026-10-19, I4): the review's session shared this
      # checkout, as the detect job's diagnosis does, so the same three steps run before the
      # step that holds the tokens: the framework it could reach is removed and checked out
      # afresh at the pin the first step read, then the project checkout's remote, refspec
      # and git config are verified from that fresh copy (plugin/ci/checkout_check.py).
      - name: Remove the framework checkout the session could reach
        if: ${{ always() }}
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh (public repository, no token)
        if: ${{ always() }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Verify the project checkout before the next step
        env:
          PIN_REF: ${{ steps.pin.outputs.ref }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
          FRAMEWORK_URL: ${{ github.server_url }}/luissiviero/sdlc-framework
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/checkout_check.py --root . --framework framework --pin-ref "$PIN_REF" --origin "$ORIGIN_URL" --framework-origin "$FRAMEWORK_URL"

      # Every Important finding enters the framework as an incident intent change: no route
      # skips the intent and design gates. Dismissed findings (changes/.dismissed.json) never return.
      - name: File the findings as incident intents
        id: route
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/scan/cli.py route --root . --findings scan-findings.json --repo "$REPO" --head "$HEAD_SHA" --max-findings 3

      # The deterministic scanners stay in CI (p.48): reports, not gates. They run even when
      # the review failed, and a finding never fails the job.
      - name: Deterministic scanners (pip-audit, bandit, npm audit)
        if: ${{ always() }}
        continue-on-error: true
        run: python framework/plugin/scan/cli.py scanners --root .

      - name: Keep the findings, the review transcript and the scanner reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-scan-${{ github.run_id }}
          path: |
            scan-findings.json
            scan-run.json
            scan-run.stderr.txt
            pip-audit.json
            bandit.json
            npm-audit.json
          if-no-files-found: ignore

      # Build guide step 41.1 (article p.39): every hook decision of the review run is one
      # line of changes/.hook-log.jsonl; the artifact keeps it readable.
      - name: Keep the hook log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-hook-log-${{ github.run_id }}
          path: changes/.hook-log.jsonl
          if-no-files-found: ignore
